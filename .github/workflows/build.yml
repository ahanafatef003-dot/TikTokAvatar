name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project folders
        run: |
          set -e
          mkdir -p app/src/main/java/com/ahnaf/floatingavatar
          if [ -f MainActivity.kt ]; then mv MainActivity.kt BubbleService.kt app/src/main/java/com/ahnaf/floatingavatar/; fi
          if [ -f AndroidManifest.xml ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f app-build.gradle.kts ]; then mv app-build.gradle.kts app/build.gradle.kts; fi
          find . -type f -not -path './.git/*' | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingAvatar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
